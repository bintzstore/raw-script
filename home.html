<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINTZ | RAW SCRIPT MANAGER</title>
    <style>
        :root { --neon: #00ffcc; --bg: #050505; --card: #0d0d12; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .container { background: var(--card); border: 1px solid var(--neon); padding: 25px; border-radius: 12px; box-shadow: 0 0 20px rgba(0, 255, 204, 0.15); width: 100%; max-width: 500px; }
        h2 { color: var(--neon); text-align: center; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 3px; font-size: 1.2rem; }
        
        .upload-area { border: 2px dashed #333; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .upload-area:hover { border-color: var(--neon); background: rgba(0, 255, 204, 0.05); }
        
        label { display: block; font-size: 12px; color: var(--neon); margin-bottom: 5px; margin-top: 10px; }
        input, textarea { width: 100%; background: #15151e; border: 1px solid #222; color: #eee; padding: 12px; border-radius: 6px; box-sizing: border-box; outline: none; transition: 0.3s; font-family: inherit; }
        input:focus, textarea:focus { border-color: var(--neon); }
        
        button { width: 100%; background: var(--neon); color: #000; border: none; padding: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 25px; transition: 0.3s; text-transform: uppercase; }
        button:hover { background: #00cca3; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 255, 204, 0.3); }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        
        #status { margin-top: 15px; font-size: 11px; text-align: center; word-break: break-all; min-height: 20px; }
        #fileInput { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>[ BINTZ_UPLOADER ]</h2>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        📁 KLIK UNTUK AMBIL FILE
    </div>
    <input type="file" id="fileInput" onchange="handleFile(this.files)">

    <label>NAMA PROYEK (URL /api/v1/nama)</label>
    <input type="text" id="projName" placeholder="Contoh: nightbug_v4">

    <label>NAMA FILE ASLI</label>
    <input type="text" id="fileName" placeholder="Contoh: script.lua" disabled>

    <label>ISI SCRIPT / KODE</label>
    <textarea id="content" rows="10" placeholder="Paste kode atau pilih file..."></textarea>

    <button id="btnSubmit" onclick="upload()">UPLOAD KE GITHUB</button>
    <div id="status"></div>
</div>

<script>
    function handleFile(files) {
        const file = files[0];
        if (!file) return;

        // Auto-fill nama proyek (hilangkan ekstensi)
        document.getElementById('projName').value = file.name.split('.').slice(0, -1).join('.');
        // Auto-fill nama file asli
        document.getElementById('fileName').value = file.name;

        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('content').value = e.target.result;
            showStatus("File berhasil dimuat!", "#00ffcc");
        };
        reader.readAsText(file);
    }

    function showStatus(msg, color) {
        const s = document.getElementById('status');
        s.innerHTML = msg;
        s.style.color = color;
    }

    async function upload() {
        const btn = document.getElementById('btnSubmit');
        const projName = document.getElementById('projName').value;
        const fileName = document.getElementById('fileName').value || projName; // Fallback
        const code = document.getElementById('content').value;

        if (!projName || !code) {
            return showStatus("Harap isi Nama Proyek dan Kode!", "#ff4444");
        }

        btn.disabled = true;
        showStatus("Menghubungi Vercel API...", "#aaa");

        try {
            const res = await fetch('/api/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ projName, fileName, code })
            });

            const data = await res.json();

            if (res.ok) {
                showStatus("BERHASIL! Mengalihkan ke RAW...", "#00ffcc");
                setTimeout(() => {
                    window.location.href = `/api/v1/${projName}`;
                }, 1500);
            } else {
                showStatus("GAGAL: " + (data.error || "Terjadi kesalahan"), "#ff4444");
                btn.disabled = false;
            }
        } catch (err) {
            showStatus("ERROR KONEKSI: " + err.message, "#ff4444");
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
